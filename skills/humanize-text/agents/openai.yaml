  short_description: "Rewrite text for more natural reading"
  icon_small: "./assets/icon.png"
  icon_large: "./assets/logo.png"
  brand_color: "#6D5EF5"
  default_prompt: "Use $humanize-text to rewrite this draft in a natural voice."
dependencies:
